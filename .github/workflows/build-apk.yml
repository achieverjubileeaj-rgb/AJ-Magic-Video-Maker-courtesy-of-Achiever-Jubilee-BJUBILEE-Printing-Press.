name: Build AJ Magic Video APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Make the Android project
        run: python3 make_android.py
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "AJ-Magic-Video-Maker-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AJ-Magic-Video-Maker-APK
          path: AJ-Magic-Video-Maker-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AJ Magic Video Maker 1.0.${{ github.run_number }}
          body: |
            Android installer for AJ Magic Video Maker.
            Courtesy of Achiever Jubilee & BJUBILEE Printing Press · +234 706 793 7199 · www.bjubileepress.com.ng
            Download the .apk below on your phone, open it and tap Install.
          files: AJ-Magic-Video-Maker-*.apk
