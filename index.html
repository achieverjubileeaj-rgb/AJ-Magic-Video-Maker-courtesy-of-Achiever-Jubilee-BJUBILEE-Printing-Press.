<title>Achiever Jubilee AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&family=Great+Vibes&family=Fredoka:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: a production console. Fixed sidebar of studios on desktop, drawer on phone; each studio is a brief on the left and a live output sheet on the right. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#07080D; --navy:#0B1222; --panel:#101A2E; --panel2:#15223B; --line:#22304D; --line2:#2E3F63;
  --text:#EEF1F7; --muted:#93A0B8; --faint:#66738C;
  --gold:#F2B33D; --orange:#FF6A1A; --ink:#140C02;
  --good:#3DDC97; --warn:#FFB020; --bad:#FF6B6B;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grad{background:linear-gradient(100deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}

/* shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--navy);border-right:1px solid var(--line);padding:20px 14px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:4px 6px}
.brand svg{width:38px;height:38px;flex:0 0 auto}
.brand b{font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1.05;display:block}
.brand small{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--gold)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{padding:6px 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem}
.nav a svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(242,179,61,.16),rgba(255,106,26,.04));color:var(--text);box-shadow:inset 2px 0 0 var(--gold)}
.side .foot{margin-top:auto;font-size:.78rem;color:var(--faint)}
.top{display:none}
main{min-width:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .22s ease;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--navy)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}

/* common */
.head{display:flex;flex-direction:column;gap:8px}
.head h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800}
.head p{color:var(--muted);max-width:68ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.gold{background:linear-gradient(100deg,var(--gold),var(--orange));color:var(--ink)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.line{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.btn.small{padding:7px 12px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.ok i{background:var(--good)} .chip.no i{background:var(--bad)} .chip.mid i{background:var(--warn)}
.note{font-size:.86rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* dashboard */
.hero{position:relative;overflow:hidden;padding:clamp(22px,4vw,40px);border-radius:16px;background:
  radial-gradient(600px 260px at 92% -20%,rgba(255,106,26,.28),transparent 70%),
  radial-gradient(500px 300px at 10% 120%,rgba(242,179,61,.16),transparent 70%),var(--navy);border:1px solid var(--line)}
.hero h1{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:800;max-width:16ch}
.hero .tag{font-family:var(--mono);font-size:.78rem;letter-spacing:.24em;color:var(--gold);margin-top:14px}
.askbar{display:flex;gap:10px;margin-top:24px;max-width:720px;flex-wrap:wrap}
.askbar input{flex:1 1 260px;min-width:0;background:rgba(7,8,13,.6);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.vbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.vbtn{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.vbtn:hover{border-color:var(--gold);transform:translateY(-2px)}
.vbtn .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--gold)}
.vbtn .ic svg{width:22px;height:22px}
.vbtn b{font-family:var(--display);font-weight:800;font-size:1.06rem;letter-spacing:.02em;text-transform:uppercase}
.vbtn span{color:var(--muted);font-size:.86rem}
.vbtn.feature{background:linear-gradient(140deg,rgba(242,179,61,.18),rgba(255,106,26,.08) 60%,var(--panel));border-color:rgba(242,179,61,.45)}
@media (max-width:980px){.vbtns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:1.25rem;font-weight:800}
.toolgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.toolgrid{grid-template-columns:1fr 1fr}}
.tool{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);min-width:0}
.tool:hover{border-color:var(--line2);background:var(--panel2)}
.tool svg{width:20px;height:20px;color:var(--orange)}
.tool b{font-size:.95rem}
.tool span{font-size:.8rem;color:var(--muted)}
.status{padding:18px;display:flex;flex-direction:column;gap:12px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;flex-wrap:wrap}
.recent{display:flex;flex-direction:column}
.recent a{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--text);min-width:0}
.recent a:first-child{border-top:0}
.recent a:hover{background:var(--panel2)}
.recent .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.recent .m{font-family:var(--mono);font-size:.72rem;color:var(--faint);white-space:nowrap}
.next{padding:18px;display:flex;flex-direction:column;gap:10px}
.next li{color:var(--muted);font-size:.88rem}
.next ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1060px){.work{grid-template-columns:1fr}}
.form{padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.flabel{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:.82rem;color:var(--muted)}
.chips input:checked+span{background:rgba(242,179,61,.16);border-color:var(--gold);color:var(--text)}
.chips input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.drop img,.drop video{max-width:100%;max-height:240px;border-radius:8px;display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.out{min-height:420px;display:flex;flex-direction:column}
.outbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.outbody{padding:20px 22px;min-width:0;overflow-wrap:anywhere}
.outbody.idle{color:var(--faint);display:flex;flex-direction:column;gap:10px;justify-content:center;flex:1}
.think{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dotp{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dotp{animation:none}.vbtn{transition:none}}
.md{font-size:.95rem}
.md h1,.md h2,.md h3{margin:1.1em 0 .45em;font-weight:800}
.md h1{font-size:1.5rem}.md h2{font-size:1.22rem;color:var(--gold)}.md h3{font-size:1.04rem}
.md>:first-child{margin-top:0}
.md p,.md ul,.md ol,.md blockquote{margin:0 0 .8em}
.md ul,.md ol{padding-left:1.3em}
.md li{margin:.2em 0}
.md strong{color:#fff}
.md blockquote{border-left:3px solid var(--orange);padding:.2em 0 .2em 1em;color:var(--muted)}
.md code{font-family:var(--mono);font-size:.86em;background:var(--panel2);padding:1px 5px;border-radius:5px}
.md pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;overflow-x:auto;white-space:pre-wrap}
.md pre code{background:none;padding:0}
.md .tw{overflow-x:auto;margin:0 0 1em}
.md table{border-collapse:collapse;font-size:.86rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.flash{font-size:.84rem;color:var(--good)}
.err{color:var(--bad);font-size:.88rem}

/* provider notice */
.gate{margin:0 16px 16px;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.06);display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.gate b{color:#fff}

/* storyboard */
.sb{display:flex;flex-direction:column;gap:14px;padding:18px}
.sbtop{display:flex;flex-direction:column;gap:8px}
.scene{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.scene header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--panel2);flex-wrap:wrap}
.scene header b{font-family:var(--display);font-weight:800}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.sgrid>div{background:var(--bg);padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sgrid .wide{grid-column:1/-1}
@media (max-width:640px){.sgrid{grid-template-columns:1fr}}
[contenteditable]{outline:none;border-radius:6px;padding:2px 4px;margin:-2px -4px}
[contenteditable]:hover{background:rgba(255,255,255,.03)}
[contenteditable]:focus{background:rgba(242,179,61,.08);box-shadow:inset 0 0 0 1px rgba(242,179,61,.5)}
.vp{font-family:var(--mono);font-size:.8rem;color:#D9DFEA}

/* chat */
.chat{display:flex;flex-direction:column;min-height:560px}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:64vh}
.msg{max-width:84%;padding:12px 14px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(100deg,rgba(242,179,61,.22),rgba(255,106,26,.16));border:1px solid rgba(242,179,61,.35)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.ai .md a[href^="#"]{display:inline-block;margin:4px 4px 0 0;padding:5px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--gold);text-decoration:none;font-weight:700;font-size:.85rem}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;min-height:48px;max-height:160px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px}

/* projects */
.ptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ptools input{flex:1 1 220px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.ptools select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .m{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.pitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.star{background:none;border:0;cursor:pointer;color:var(--faint);font-size:1.15rem;line-height:1}
.star.on{color:var(--gold)}
@media (max-width:640px){.pitem{grid-template-columns:auto minmax(0,1fr)}.pitem .acts{grid-column:1/-1;justify-content:flex-start}}
.renamer{display:flex;gap:6px}
.renamer input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--gold);border-radius:8px;padding:6px 9px}

/* providers */
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.prov{padding:18px;display:flex;flex-direction:column;gap:10px}
.prov h3{font-size:1.15rem;font-weight:800}
.prov p{font-size:.88rem;color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:18px}
.steps li{list-style:none;counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--gold);font-family:var(--mono);font-size:.8rem}
.steps ol{margin:0;padding:0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,4,8,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px}
.modal .box header{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.voicebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=range]{accent-color:var(--orange);width:100%}

/* video maker */
.mk-left{display:flex;flex-direction:column;gap:18px;min-width:0}
.mk-stage{display:flex;justify-content:center;align-items:center;background:var(--bg);padding:16px;border-bottom:1px solid var(--line)}
.mk-stage canvas{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mk-ctrl{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.mk-ctrl input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--gold)}
.mk-time{font-family:var(--mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mk-exp{padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.mk-bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.mk-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange))}
.mk-result{display:flex;flex-direction:column;gap:10px}
.mk-result video{width:100%;max-height:50vh;border-radius:8px;background:#000}
.mk-scenes{display:flex;flex-direction:column;gap:12px}
.mk-sc{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px}
.mk-fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.mk-thumb{width:76px;height:76px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-family:var(--mono);font-size:.7rem;cursor:pointer;position:relative}
.mk-thumb img{width:100%;height:100%;object-fit:cover}
.mk-thumb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mk-thumb:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.mk-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-tools{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:1060px){.mk .out{order:-1}}
.mk-tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mk-tpl{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.mk-tpl canvas{width:100%;height:auto;aspect-ratio:9/16;border-radius:8px;display:block}
.mk-tpl span{font-size:.76rem;font-weight:700;line-height:1.25;color:var(--muted)}
.mk-tpl[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mk-tpl[aria-pressed="true"] span{color:var(--text)}
.mk-prompts{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 chat:'<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>',

 chart:'<path d="M4 20V4M4 20h16"/><path d="M7 15l4-4 3 3 5-6"/>',
 church:'<path d="M12 2v5M10 4h4"/><path d="M5 21V11l7-4 7 4v10z"/><path d="M10 21v-5h4v5"/>',
 star:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>'
};
const ico=(n,s)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${s||''}>${I[n]||''}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));

/* ---------- markdown ---------- */
function md(t){
  let html;
  try{ html = window.marked ? marked.parse(String(t||''),{gfm:true,breaks:false}) : '<p>'+esc(t).replace(/\n/g,'<br>')+'</p>'; }catch(e){ html='<p>'+esc(t)+'</p>'; }
  if(window.DOMPurify) html = DOMPurify.sanitize(html);
  else html = '<p>'+esc(t).replace(/\n/g,'<br>')+'</p>';
  return html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
}

/* ---------- toast & modal ---------- */
let toastT;
function toast(msg){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true},2400); }
function modal(title, bodyHtml, onMount){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="box"><header><b>${esc(title)}</b><button class="btn line small" type="button" data-x>Close</button></header><div class="mbody">${bodyHtml}</div></div></div>`;
  const close=()=>{root.innerHTML=''};
  $('[data-x]',root).onclick=close;
  $('.modal',root).addEventListener('click',e=>{ if(e.target.classList.contains('modal')) close(); });
  if(onMount) onMount($('.mbody',root),close);
  return close;
}
async function copyText(text,btn){
  try{ await navigator.clipboard.writeText(text); toast('Copied'); }
  catch(e){ modal('Copy this text', `<div style="padding:16px"><textarea style="width:100%;min-height:260px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px" readonly>${esc(text)}</textarea><p class="note" style="margin-top:8px">Your device blocked automatic copying. Select the text and copy it.</p></div>`, b=>{const ta=$('textarea',b);ta.focus();ta.select();}); }
}

/* ---------- runtime capabilities ---------- */
const C=window.claude;
const use=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
let SAMPLE=null, SAMPLE_READY=false, CAN_IMG=false, DOWNLOADS=null;
use('sample').then(async s=>{ SAMPLE=s; SAMPLE_READY=true; if(s){ try{const l=await s.limits(); CAN_IMG=!!(l&&l.images);}catch(e){} } refreshAIState(); });
use('downloads').then(d=>{DOWNLOADS=d;});
function refreshAIState(){ $$('[data-needs-ai]').forEach(b=>{ if(SAMPLE_READY && !SAMPLE){ b.disabled=true; b.title='Open this page in Claude to use the AI tools'; } }); const s=$('#aiStatus'); if(s) s.innerHTML=aiChip(); }
function aiChip(){ if(!SAMPLE_READY) return '<span class="chip mid"><i></i>Connecting</span>'; return SAMPLE?'<span class="chip ok"><i></i>Ready</span>':'<span class="chip no"><i></i>Unavailable here</span>'; }
const ERR={not_granted:'Claude access was not allowed for this page. Reload the page to be asked again.',sampling_disabled:'Claude is not available on this account.',rate_limited:'Too many requests just now. Wait a minute and try again.',session_expired:'Your Claude session expired. Sign in again and reload.',refused:'Claude declined this request. Change the wording and try again.',empty_completion:'No answer came back. Try a shorter, simpler request.',invalid_json:'The storyboard came back in the wrong format. Press Generate again.',prompt_too_large:'The request is too long. Shorten the details.',image_rejected:'That image could not be used. Try a JPG or PNG under 20 MB.',images_unavailable:'Image reading is not available in this view. Describe the image in words instead.'};
const errCopy=e=>ERR[e&&e.code]||'Something went wrong reaching Claude. Try again.';
async function ask(input,opts){ if(!SAMPLE) throw {code:'sampling_disabled'}; return SAMPLE(input,opts||{}); }
async function saveFile(name,data){
  if(DOWNLOADS){ try{ await DOWNLOADS.save({filename:name,data}); toast('Saved '+name); return; }catch(e){ if(e&&e.code==='declined') return; } }
  copyText(data);
}

/* ---------- project store ---------- */
const Store={mode:'loading',items:[],listeners:[],db:null,uid:null,
  emit(){ this.listeners.forEach(f=>{try{f()}catch(e){}}); },
  on(f){ this.listeners.push(f); return ()=>{this.listeners=this.listeners.filter(x=>x!==f)}; },
  async init(){
    const [db,user]=await Promise.all([use('db'),use('user')]);
    let uid=null; try{ uid=user?await user.id():null; }catch(e){}
    if(db&&uid){
      this.db=db; this.uid=uid; this.mode='cloud';
      const col=db.collection('data/users/'+uid);
      const timer=setTimeout(()=>{ if(this.mode==='cloud'&&!this.loaded){ this.slow=true; this.emit(); } },10000);
      col.orderBy('updated','desc').limit(300).onSnapshot(snap=>{
        if(!snap.metadata.fromCache){ clearTimeout(timer); this.slow=false; }
        this.loaded=true;
        this.items=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        this.emit();
      },err=>{ clearTimeout(timer); this.toLocal(); });
    } else this.toLocal();
  },
  toLocal(){ this.mode='local'; this.db=null; try{ this.items=JSON.parse(localStorage.getItem('aj-projects')||'[]'); }catch(e){ this.items=[]; } this.loaded=true; this.emit(); },
  persistLocal(){ try{ localStorage.setItem('aj-projects',JSON.stringify(this.items)); }catch(e){} this.emit(); },
  async add(p){
    const now=Date.now(); const body=Object.assign({folder:p.folder||TOOLNAME[p.tool]||'General',fav:false,created:now,updated:now},p);
    if(this.mode==='cloud'){ try{ const ref=this.db.collection('data/users/'+this.uid).doc(); await ref.set(body); return ref.id; }catch(e){ if(e&&e.code==='quota_exceeded'){ toast('Storage is full. Delete old projects first.'); throw e; } this.toLocal(); } }
    const id='p'+now.toString(36)+Math.random().toString(36).slice(2,6); this.items.unshift(Object.assign({id},body)); this.persistLocal(); return id;
  },
  async update(id,patch){
    patch=Object.assign({},patch,{updated:Date.now()});
    if(this.mode==='cloud'){ await this.db.doc('data/users/'+this.uid+'/'+id).update(patch); return; }
    const it=this.items.find(x=>x.id===id); if(it) Object.assign(it,patch); this.items.sort((a,b)=>b.updated-a.updated); this.persistLocal();
  },
  async remove(id){
    if(this.mode==='cloud'){ await this.db.doc('data/users/'+this.uid+'/'+id).delete(); return; }
    this.items=this.items.filter(x=>x.id!==id); this.persistLocal();
  },
  get(id){ return this.items.find(x=>x.id===id); }
};
Store.init();

/* ---------- routing / nav ---------- */
const APK=!!window.AJ_APK;
const NAV=APK?[['Make videos',[['maker','Magic Video Maker','film'],['camera','Live Magic Camera','video'],['help','How to use the app','chat'],['projects','My Projects','folder'],['about','About & contact','spark']]]]:[
 ['Studio',[['home','Dashboard','home'],['assistant','AI Creative Assistant','chat']]],
 ['Video Studio',[['maker','Magic Video Maker','film'],['camera','Live Magic Camera','video'],['help','How to use the app','chat'],['director','Ad Director','clap'],['text-video','Text to Video','text'],['image-video','Image to Video','image'],['video-video','Video to Video','video'],['providers','Video Providers','plug']]],
 ['Content',[['social','Social Media Creator','social'],['strategy','Marketing Strategist','chart'],['church','Church & Ministry','church'],['seasonal','Christmas & 2027','star'],['prompts','Prompt Engine','spark'],['voice','Voice Studio','mic']]],
 ['Library',[['projects','My Projects','folder'],['about','About & contact','spark']]]
];
const TOOLNAME={}; NAV.forEach(g=>g[1].forEach(([id,name])=>TOOLNAME[id]=name));
function renderNav(cur){
  $('#nav').innerHTML=NAV.map(([g,items])=>`<div class="navgroup"><span class="label">${g}</span>${items.map(([id,name,ic])=>`<a href="#${id}" ${id===cur?'aria-current="page"':''}>${ico(ic)}${name}</a>`).join('')}</div>`).join('');
}
if(APK){ $$('.brand small').forEach(x=>x.textContent='MAGIC VIDEO MAKER'); document.title='AJ Magic Video'; }
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#side').addEventListener('click',e=>{ if(e.target.closest('a')) $('#side').classList.remove('open'); });
document.addEventListener('click',e=>{ const s=$('#side'); if(s.classList.contains('open') && !e.target.closest('#side') && !e.target.closest('#menuBtn')) s.classList.remove('open'); });

let cleanup=null; const PREFILL={};
function route(){
  const HOME=APK?'maker':'home', id=(location.hash||'#'+HOME).slice(1)||HOME;
  const view=VIEWS[id]&&(!APK||TOOLNAME[id])?id:HOME;
  if(cleanup){ try{cleanup()}catch(e){} cleanup=null; }
  renderNav(view);
  const main=$('#main'); main.innerHTML='<div class="view"></div>';
  cleanup=VIEWS[view]($('.view',main))||null;
  window.scrollTo(0,0); refreshAIState();
}
window.addEventListener('hashchange',route);

/* ---------- shared form builder ---------- */
const ASPECTS=['TikTok · 9:16','Instagram Reels · 9:16','Facebook Reels · 9:16','YouTube Shorts · 9:16','WhatsApp Status · 9:16','YouTube landscape · 16:9','Business ad · 16:9','Instagram feed · 4:5','Square post · 1:1'];
function fieldHtml(f){
  const id='f-'+f.id;
  if(f.type==='select') return `<div class="field"><label for="${id}">${f.label}</label><select id="${id}" name="${f.id}">${f.options.map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(f.type==='textarea') return `<div class="field"><label for="${id}">${f.label}</label><textarea id="${id}" name="${f.id}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea></div>`;
  if(f.type==='chips') return `<div class="field"><span class="flabel">${f.label}</span><div class="chips" role="group" aria-label="${esc(f.label)}">${f.options.map((o,i)=>`<label><input type="checkbox" id="${id}-${i}" name="${f.id}" value="${esc(o)}" ${(f.value||[]).includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`;
  if(f.type==='image') return `<div class="field"><span class="flabel">${f.label}</span><div class="drop"><input type="file" id="${id}" accept="image/jpeg,image/png,image/webp" name="${f.id}"><img alt="" hidden><span class="note">${f.help||''}</span></div></div>`;
  if(f.type==='video') return `<div class="field"><span class="flabel">${f.label}</span><div class="drop"><input type="file" id="${id}" accept="video/*" name="${f.id}"><video controls muted playsinline hidden></video><span class="note">${f.help||''}</span></div></div>`;
  if(f.type==='check') return `<div class="field"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--text)"><input type="checkbox" id="${id}" name="${f.id}" style="margin-top:4px">${f.label}</label></div>`;
  return `<div class="field"><label for="${id}">${f.label}</label><input type="text" id="${id}" name="${f.id}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}
function readForm(form,fields){
  const v={};
  fields.forEach(f=>{
    if(f.type==='chips') v[f.id]=$$(`input[name="${f.id}"]:checked`,form).map(x=>x.value);
    else if(f.type==='check') v[f.id]=$(`#f-${f.id}`,form).checked;
    else if(f.type==='image'||f.type==='video') v[f.id]=$(`#f-${f.id}`,form).files[0]||null;
    else v[f.id]=($(`#f-${f.id}`,form)||{}).value||'';
  });
  return v;
}
function wireMedia(form){
  $$('.drop input[type=file]',form).forEach(inp=>{
    inp.addEventListener('change',()=>{
      const f=inp.files[0]; const box=inp.parentElement; const img=$('img',box), vid=$('video',box);
      if(!f) return; const url=URL.createObjectURL(f);
      if(img){ img.src=url; img.hidden=false; }
      if(vid){ vid.src=url; vid.hidden=false; }
    });
  });
}
async function frameFromVideo(file){
  return new Promise(res=>{
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; v.src=URL.createObjectURL(file);
    v.onloadeddata=()=>{ v.currentTime=Math.min(1,(v.duration||2)/2); };
    v.onseeked=()=>{ const c=document.createElement('canvas'); const w=Math.min(1280,v.videoWidth||640); c.width=w; c.height=Math.round(w*(v.videoHeight||360)/(v.videoWidth||640)); c.getContext('2d').drawImage(v,0,0,c.width,c.height); c.toBlob(b=>res(b),'image/jpeg',.85); };
    v.onerror=()=>res(null); setTimeout(()=>res(null),8000);
  });
}

const BRAND='BJUBILEE Printing Press — printing, graphic design, signage, LED signs, book publishing, video and photography. 1st Floor, Chief Idowu Shopping Complex, Addo Road, Oke-Ira Kekere, Ajah, Lagos. Phone/WhatsApp 0706 793 7199. Tagline: "We don\'t just print ideas. We bring them to life."';
const HOUSE='Write in clear, natural English suited to a Nigerian and international audience. Be specific and practical. Never invent prices, statistics, testimonials, awards or client names. Use Markdown with ## headings, short paragraphs, bullet lists and tables where useful. Do not add a preamble; start with the first heading.';

/* ---------- generic generator view ---------- */
function generator(el,cfg){
  const pre=PREFILL[cfg.id]; delete PREFILL[cfg.id];
  const fields=cfg.fields.map(f=>Object.assign({},f,pre&&pre[f.id]!=null?{value:pre[f.id]}:{}));
  el.innerHTML=`<div class="head"><span class="label">${cfg.kicker}</span><h1>${cfg.title}</h1><p>${cfg.desc}</p></div>
  <div class="work">
    <form class="panel form" novalidate>${fields.map(fieldHtml).join('')}
      <div class="actions"><button class="btn gold" type="submit" data-needs-ai>${cfg.cta||'Generate'}</button>${cfg.video?'<button class="btn line" type="button" data-gen>Generate video</button>':''}</div>
      <p class="note">${cfg.foot||'Writing is done by Claude on your own Claude account.'}</p>
    </form>
    <section class="panel out" aria-live="polite">
      <div class="outbar"><span class="label">${cfg.outLabel||'Output'}</span><div class="actions" data-acts hidden><button class="btn line small" type="button" data-copy>Copy</button><button class="btn line small" type="button" data-save>Save to projects</button><button class="btn line small" type="button" data-dl>Download</button><button class="btn line small" type="button" data-again data-needs-ai>Regenerate</button></div><button class="btn line small" type="button" data-stop hidden>Stop</button></div>
      <div data-gate></div>
      <div class="outbody idle" data-body>${cfg.idle||'Fill in the brief and press Generate. Your result appears here, and you can edit the brief and regenerate as often as you like.'}</div>
    </section>
  </div>`;
  const form=$('form',el), body=$('[data-body]',el), acts=$('[data-acts]',el), stop=$('[data-stop]',el), gate=$('[data-gate]',el);
  wireMedia(form);
  let ctl=null, last='', lastV=null;
  async function run(nocache){
    const v=readForm(form,fields); lastV=v;
    const bad=cfg.validate&&cfg.validate(v); if(bad){ body.className='outbody'; body.innerHTML=`<p class="err">${esc(bad)}</p>`; return; }
    if(ctl) ctl.abort(); ctl=new AbortController();
    acts.hidden=true; stop.hidden=false; gate.innerHTML='';
    body.className='outbody'; body.innerHTML='<div class="think"><span class="dotp"></span>Thinking… this can take up to a minute.</div>';
    try{
      const opts={signal:ctl.signal,onText:({text})=>{ body.innerHTML='<div class="md">'+md(text)+'</div>'; }};
      if(nocache) opts.cache=false;
      if(cfg.images){ const imgs=await cfg.images(v); if(imgs&&imgs.length){ if(!CAN_IMG) throw {code:'images_unavailable'}; opts.images=imgs; } }
      const {text,truncated}=await ask(cfg.build(v),opts);
      last=text; body.innerHTML='<div class="md">'+md(text)+'</div>'+(truncated?'<p class="note">The answer was cut short. Ask for less detail and regenerate.</p>':'');
      acts.hidden=false;
    }catch(e){
      if(e&&e.code==='cancelled'){ if(e.text){ last=e.text; acts.hidden=false; } else body.innerHTML='<p class="note">Stopped.</p>'; }
      else { body.innerHTML=(e&&e.text?'<div class="md">'+md(e.text)+'</div>':'')+`<p class="err">${esc(errCopy(e))}</p>`; if(e&&e.text){last=e.text;acts.hidden=false;} }
    }finally{ stop.hidden=true; ctl=null; }
  }
  form.addEventListener('submit',e=>{e.preventDefault(); run(false);});
  $('[data-again]',el).onclick=()=>run(true);
  stop.onclick=()=>ctl&&ctl.abort();
  $('[data-copy]',el).onclick=()=>copyText(last);
  $('[data-dl]',el).onclick=()=>saveFile(slug(cfg.name(lastV||{}))+'.md',last);
  $('[data-save]',el).onclick=async e=>{ const b=e.currentTarget; b.disabled=true; try{ await Store.add({tool:cfg.id,title:cfg.name(lastV||{}),kind:'md',content:last}); toast('Saved to My Projects'); }catch(x){} b.disabled=false; };
  const g=$('[data-gen]',el); if(g) g.onclick=()=>{ gate.innerHTML=providerGate(last); wireGate(gate,last); };
  return ()=>{ if(ctl) ctl.abort(); };
}

function mkSong(c,o,dur,{bpm,mel,chords,lead,lv,pad,bass,extra}){

    b=0; chords.forEach(([k,d])=>{ const t=t0+b*sb; if(k&&t<dur){ if(pad) MI.pad(c,o,t,CH[k],pad,d*sb); if(bass) MI.bass(c,o,t,CH[k][0]-12,bass,d*sb*.9); } b+=d; });

function mkReverb(c,o){ const conv=c.createConvolver(), n=Math.floor(c.sampleRate*2.2), b=c.createBuffer(2,n,c.sampleRate); for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); } conv.buffer=b; const wet=c.createGain(); wet.gain.value=.22; conv.connect(wet); wet.connect(o); return conv; }
function mkRenderSong(id,dur){
  dur=Math.ceil(dur)+1; const key=id+'@'+dur+(id==='words'?'|'+(MK.musicText||''):''); if(MK_SONG_CACHE[key]) return MK_SONG_CACHE[key];
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OC||!MK_SONGS[id]) return Promise.resolve(null);
  const sr=32000, c=new OC(2,sr*dur,sr), master=c.createGain(), comp=c.createDynamicsCompressor(), bus=c.createGain();
  master.gain.value=.9; comp.threshold.value=-14; comp.ratio.value=4; master.connect(comp); comp.connect(c.destination);
  bus.connect(master); bus.connect(mkReverb(c,master));
  MK_SONGS[id](c,bus,dur-.5);
  const p=c.startRendering().then(b=>{ let pk=0; for(let ch=0;ch<b.numberOfChannels;ch++){ const d=b.getChannelData(ch); for(let i=0;i<d.length;i+=3) pk=Math.max(pk,Math.abs(d[i])); } const k=pk>0.01?Math.min(3,.85/pk):1; if(k!==1) for(let ch=0;ch<b.numberOfChannels;ch++){ const d=b.getChannelData(ch); for(let i=0;i<d.length;i++) d[i]*=k; } return b; }).catch(()=>{ delete MK_SONG_CACHE[key]; return null; });
  MK_SONG_CACHE[key]=p; return p;
}
async function mkDecode(file){ const ab=await file.arrayBuffer(); const c=new MK_AC(); try{ return await new Promise((res,rej)=>{ const pr=c.decodeAudioData(ab,res,rej); if(pr&&pr.then) pr.then(res,rej); }); } finally{ try{ c.close(); }catch(e){} } }

/* Wire music + voice into an audio graph, starting `offset` seconds into the video. Returns the started nodes. */
function mkConnectAudio(c,dest,music,voice,offset,total){
  const now=c.currentTime+.06, left=Math.max(.1,total-offset), nodes=[];
  if(music){ const s=c.createBufferSource(); s.buffer=music; s.loop=true; const g=c.createGain(), v=MK.musicVol;
    const vEnd=voice?Math.max(0,voice.duration+MK.voiceDelay-offset):0, duck=v*.28;
    g.gain.setValueAtTime(vEnd>0?duck:v,now);
    if(vEnd>0&&vEnd<left){ g.gain.setValueAtTime(duck,now+vEnd); g.gain.linearRampToValueAtTime(v,now+vEnd+.8); }
    const fo=Math.max(0,left-1.5); g.gain.setValueAtTime(vEnd>fo?duck:v,now+fo); g.gain.linearRampToValueAtTime(0.0001,now+left);
    s.connect(g); g.connect(dest); s.start(now,offset%music.duration); s.stop(now+left+.1); nodes.push(s); }
  if(voice){ const vs=offset-MK.voiceDelay; if(vs<voice.duration){ const s=c.createBufferSource(); s.buffer=voice; const g=c.createGain(); g.gain.value=MK.voiceVol; s.connect(g); g.connect(dest);
    if(vs>=0) s.start(now,vs); else s.start(now-vs); nodes.push(s); } }
  return nodes;
}

function mkLoadImg(file,maxSide){

async function mkBridgeSave(name,blob){

  for(let o=0;o<blob.size;o+=CH){ const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=rej; fr.readAsDataURL(blob.slice(o,o+CH)); }); if(!B.append(tok,b64)) throw new Error('append'); }

}
async function mkSaveBlob(name,blob){
  if(window.AJBridge){ try{ const uri=await mkBridgeSave(name,blob); toast('Saved to your Gallery · Movies › AJ Magic Video'); return uri; }catch(e){ toast('Could not save. Check that your phone has free space.'); return ''; } }
  if(DOWNLOADS){
    try{ await DOWNLOADS.save({filename:name,data:blob}); toast('Saved '+name); return; }
    catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='too_large'){ toast('This video is too large to save here. Make it shorter.'); return; } if(e&&e.code==='rate_limited'){ toast('A save is already waiting. Answer it first.'); return; } }
  }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Saving '+name); }

  $('#mkCompose',el).onclick=()=>{ MK.musicText=$('#mk-mtext',el).value.trim()||'AJ Magic Video'; const pl=mkWordsPlan(MK.musicText); $('#mkComposeNote',el).textContent=`Mood: ${({bright:'Bright & upbeat',epic:'Epic & cinematic',afro:'Afro groove',gospel:'Gospel & praise',dream:'Dreamy & inspiring'})[pl.mood]} · ${pl.bpm} beats per minute`; warmMusic(); restartAudio(); };

  const takeVoice=async e=>{ const f=e.target.files[0]; if(!f) return; $('#mkVoiceName',el).textContent='Opening…'; try{ MK.voiceBuf=await mkDecode(f); MK.voiceName=f.name||'Voice recording'; toast('Voiceover added'); }catch(x){ toast('That recording could not be opened. Try M4A, MP3 or WAV.'); } e.target.value=''; fileLabels(); restartAudio(); };
  $('#mk-vrec',el).onchange=takeVoice; $('#mk-vfile',el).onchange=e=>{ MK.voiceDelay=.5; takeVoice(e); };
  const mic=$('#mkMic',el); let micRec=null, micStream=null, micT0=0, micTimer=0;

    if(micRec){ micRec.stop(); return; }

    const ch=[]; micRec=new MediaRecorder(micStream); micRec.ondataavailable=e=>{ if(e.data&&e.data.size) ch.push(e.data); };
    micRec.onstop=async()=>{ clearInterval(micTimer); micStream.getTracks().forEach(t=>t.stop()); micRec=null; mic.textContent='Record voice'; playing=false; playBtn.textContent='Play';

  };
  $('#mkVoiceX',el).onclick=()=>{ MK.voiceBuf=null; MK.voiceName=''; fileLabels(); restartAudio(); };
  $('#mkScriptCopy',el).onclick=()=>copyText(MK.scenes.map(sc=>sc.title+(sc.sub?'. '+sc.sub:'')).join('\n\n'));
  $('#mkAdd',el).onclick=()=>{ MK.scenes.push({title:'New headline',sub:'Supporting line',dur:3,img:null,imgUrl:'',motion:MK_MOTIONS[MK.scenes.length%4][0]}); renderScenes(); seek(starts()[MK.scenes.length-1]+1.2); const ins=$$('[data-f="title"]',sceneBox); const last=ins[ins.length-1]; if(last){ last.focus(); last.select(); } };

  $('#mkAI',el).onclick=async e=>{

    const prompt=`You write the on-screen text for a short animated video in a "${MK_TPL[MK.tpl].name}" style, ${MK.aspect} format.\nTopic: ${topic}\nBusiness context, use only if it fits the topic: ${BRAND}\nReturn ONLY a JSON array of exactly ${n} objects like [{"title":"...","sub":"..."}]. title: at most 6 words, punchy. sub: at most 10 words. Make the last scene a clear call to action. Never invent prices, discounts, dates or statistics that are not in the topic. No markdown and no commentary.`;
    try{
      const {text}=await ask(prompt,{cache:false});
      const m=String(text).match(/\[[\s\S]*\]/); let arr; try{ arr=JSON.parse(m?m[0]:text); }catch(x){ throw {code:'invalid_json'}; }
      if(!Array.isArray(arr)||!arr.length) throw {code:'invalid_json'};
      MK.scenes=arr.slice(0,8).map((o,i)=>{ const old=MK.scenes[i]||{}; return {title:String(o.title||'').slice(0,80),sub:String(o.sub||'').slice(0,120),dur:old.dur||3,img:old.img||null,imgUrl:old.imgUrl||'',lib:!!old.lib,motion:old.motion||MK_MOTIONS[i%4][0]}; });
      MK.edited=true; renderScenes(); seek(1.2); showTpl(); msg.textContent='Scenes updated. Edit any line below.';
    }catch(x){ msg.textContent=x&&x.code==='invalid_json'?'The answer came back in the wrong format. Press Write scenes again.':errCopy(x); }
    finally{ btn.disabled=false; refreshAIState(); }
  };

  $('#mkCancel',el).onclick=()=>{ if(expCancel) expCancel(); };
  $('#mkExport',el).onclick=async()=>{
    if(exporting) return; const total=mkTotal(); if(!total) return;
    setPlay(false); exporting=true;
    const W=cv.width, H=cv.height, expBtn=$('#mkExport',el), cancelBtn=$('#mkCancel',el), prog=$('#mkProg',el), bar=$('#mkBar',el), ptxt=$('#mkPtxt',el);
    expBtn.disabled=true; cancelBtn.hidden=false; prog.hidden=false; bar.style.width='0%'; ptxt.textContent='Starting…'; result.innerHTML='';
    const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(x){ return false; } })||'';
    let stream=null, actx=null, adest=null, anodes=[], music=null, rec=null;
    const finish=()=>{ anodes.forEach(n=>{ try{ n.stop(); }catch(x){} }); if(actx){ try{ actx.close(); }catch(x){} } if(stream) stream.getTracks().forEach(t=>t.stop()); exporting=false; expCancel=null; dirty=true; expBtn.disabled=false; cancelBtn.hidden=true; prog.hidden=true; };
    try{
      const sound=MK.track!=='none'||!!MK.voiceBuf;
      if(sound){ actx=new MK_AC(); adest=actx.createMediaStreamDestination(); try{ actx.resume(); }catch(x){} ptxt.textContent='Preparing music…'; music=await mkMusicBuf(total); }
      mkDraw(ctx,W,H,0);
      stream=cv.captureStream(30);
      if(adest){ await actx.resume(); adest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr)); }
      const vbr=total>150?2500000:total>45?3500000:5000000, ro={videoBitsPerSecond:vbr,audioBitsPerSecond:192000}; if(mime) ro.mimeType=mime; rec=new MediaRecorder(stream,ro);
    }catch(x){ finish(); result.innerHTML='<p class="err">This device could not start recording. Open the app in Chrome on Android or on a computer and try again.</p>'; return; }
    const chunks=[]; rec.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
    const stopped=new Promise(r=>{ rec.onstop=r; });
    let cancelled=false;
    rec.start(500);
    if(adest) anodes=mkConnectAudio(actx,adest,music,MK.voiceBuf,0,total);
    const t0=performance.now();
    await new Promise(res=>{
      expCancel=()=>{ cancelled=true; res(); };
      const step=()=>{ if(cancelled) return; const t=(performance.now()-t0)/1000;
        mkDraw(ctx,W,H,Math.min(t,total)); bar.style.width=Math.min(100,t/total*100)+'%';
        ptxt.textContent=`Recording ${mkFmt(Math.min(t,total))} of ${mkFmt(total)}. Keep this screen open.`;
        if(t>=total+.2){ res(); return; } requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
    try{ rec.stop(); }catch(x){} await stopped; finish();
    if(cancelled){ result.innerHTML='<p class="note">Export stopped.</p>'; return; }
    const type=(rec.mimeType||mime||'video/webm').split(';')[0], ext=type.indexOf('mp4')>=0?'mp4':'webm';
    const blob=new Blob(chunks,{type});
    if(!blob.size){ result.innerHTML='<p class="err">No video data was recorded. Keep the screen on during export and try again.</p>'; return; }
    if(outUrl) URL.revokeObjectURL(outUrl); outUrl=URL.createObjectURL(blob);
    const name='aj-magic-video-'+slug((MK.scenes[0]||{}).title||MK.tpl).slice(0,28)+'-'+Date.now().toString(36)+'.'+ext;
    result.innerHTML=`<div class="mk-result"><video controls playsinline src="${outUrl}"></video>
      <div class="srow"><span class="note mono">${ext.toUpperCase()} · ${W}×${H} · ${(blob.size/1048576).toFixed(1)} MB</span><span class="actions"><button class="btn gold small" type="button" id="mkSaveFile">Save video</button><button class="btn line small" type="button" id="mkShare" hidden>Share to TikTok, WhatsApp…</button></span></div>
      ${ext==='webm'?'<p class="note">This device saved the video as WebM. It plays on YouTube, Facebook, Chrome and VLC. For WhatsApp Status, convert it to MP4 first.</p>':''}</div>`;
    $('#mkSaveFile',el).onclick=async e=>{ const b=e.currentTarget; b.disabled=true; const uri=await mkSaveBlob(name,blob); b.disabled=false;
      if(uri&&window.AJBridge){ b.textContent='Saved'; const sh=$('#mkShare',el); sh.hidden=false; sh.onclick=()=>window.AJBridge.share(uri,blob.type||'video/mp4'); } };
  };

  if(MK.t<.5) MK.t=1.2; sizeCanvas(); renderScenes(); fileLabels(); showTpl(); drawThumbs(); scrub.value=MK.t; warmMusic();
  if(document.fonts&&document.fonts.load){ Promise.all([document.fonts.load('800 60px "Bricolage Grotesque"'),document.fonts.load('600 30px Manrope'),document.fonts.load('700 60px "Playfair Display"'),document.fonts.load('400 60px "Great Vibes"')]).then(()=>{ dirty=true; drawThumbs(); }).catch(()=>{}); }
  raf=requestAnimationFrame(frame);
  return ()=>{ cancelAnimationFrame(raf); stopAudio(); if(pac){ try{ pac.close(); }catch(e){} } if(expCancel) expCancel(); };
};


/* assistant */
VIEWS.assistant=el=>{
  const pre=PREFILL.assistant; delete PREFILL.assistant;
  const turns=[];
  const RULES=`You are the AI Creative Assistant inside "Achiever Jubilee AI", a creative and marketing studio by Achiever Jubilee (founder of BJUBILEE Printing Press, Ajah, Lagos). Help users plan and write content: ads, captions, scripts, church materials, marketing ideas and prompts. Be warm, practical and concise; use Markdown. When a studio in the app fits the request, add a link on its own line using exactly this form: [Open Ad Director](#director). Available studios and their links: #director (video ad concept, script, storyboard), #text-video, #image-video, #video-video (AI video prompts), #social (social posts), #strategy (marketing plan and 30-day calendar), #church (church content), #seasonal (Christmas and New Year 2027), #prompts (prompt engine), #voice (voice scripts and preview), #projects (saved work), #providers (connecting video APIs). Be honest: this app writes prompts and scripts; rendering real video needs a connected provider such as Google Veo, Runway or Kling. Never invent prices, statistics or testimonials. Business context if relevant: ${BRAND}`;
  el.innerHTML=`<div class="head"><span class="label">Studio · Assistant</span><h1>AI Creative Assistant</h1><p>Ask for ideas, drafts or help finding the right studio. It can write content directly and send you to the right tool.</p></div>
  <section class="panel chat"><div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="sugs" id="sugs">${['Plan a 30-second ad for my print shop','Write 5 TikTok hooks for LED signs','Ideas for a church revival campaign','What can this app do?'].map(s=>`<button class="btn line small" type="button">${esc(s)}</button>`).join('')}</div>
    <form class="composer" id="comp"><label for="cin" style="position:absolute;left:-9999px">Message</label><textarea id="cin" placeholder="Type your message…"></textarea><div style="display:flex;flex-direction:column;gap:6px"><button class="btn gold" type="submit" data-needs-ai>Send</button><button class="btn line small" type="button" id="cstop" hidden>Stop</button></div></form>
  </section>`;
  const msgs=$('#msgs'); let ctl=null;
  const add=(role,html)=>{ const d=document.createElement('div'); d.className='msg '+role; d.innerHTML=html; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; };
  add('ai','<div class="md"><p>Hello! I can draft ads, captions, church content and marketing plans, or point you to the right studio. What are we creating today?</p></div>');
  async function send(q){
    q=q.trim(); if(!q||ctl) return; $('#sugs').hidden=true;
    add('me',esc(q).replace(/\n/g,'<br>')); turns.push({role:'user',content:q});
    const bub=add('ai','<span class="think"><span class="dotp"></span>Thinking…</span>');
    ctl=new AbortController(); $('#cstop').hidden=false;
    try{
      const recent=turns.slice(-12); if(recent[0].role!=='user') recent.shift();
      const {text}=await ask([{role:'user',content:RULES},...recent],{cache:false,signal:ctl.signal,onText:({text})=>{bub.innerHTML='<div class="md">'+md(text)+'</div>'; msgs.scrollTop=msgs.scrollHeight;}});
      turns.push({role:'assistant',content:text});
    }catch(e){ if(e&&e.code==='cancelled'){ if(e.text) turns.push({role:'assistant',content:e.text}); else bub.innerHTML='<span class="note">Stopped.</span>'; } else { bub.innerHTML=(e&&e.text?'<div class="md">'+md(e.text)+'</div>':'')+`<p class="err">${esc(errCopy(e))}</p>`; turns.pop(); } }
    finally{ ctl=null; $('#cstop').hidden=true; }
  }
  $('#comp').onsubmit=e=>{e.preventDefault(); const v=$('#cin').value; $('#cin').value=''; send(v);};
  $('#cin').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#comp').requestSubmit(); } });
  $('#cstop').onclick=()=>ctl&&ctl.abort();
  $$('#sugs button').forEach(b=>b.onclick=()=>send(b.textContent));
  if(pre&&pre.q) setTimeout(()=>send(pre.q),0);
  return ()=>{ if(ctl) ctl.abort(); };
};

        <div class="md" style="color:var(--muted)"><p contenteditable="true" data-top="concept">${esc(b.concept)}</p></div>

      ${b.scenes.map((s,i)=>`<article class="scene" data-i="${i}"><header><b>Scene ${i+1} · <span contenteditable="true" data-k="seconds">${esc(s.seconds)}</span>s</b><div class="actions"><button class="btn line small" type="button" data-up ${i?'':'disabled'} aria-label="Move scene up">↑</button><button class="btn line small" type="button" data-down ${i<b.scenes.length-1?'':'disabled'} aria-label="Move scene down">↓</button><button class="btn line small" type="button" data-send>Open in Text to Video</button><button class="btn line small" type="button" data-del>Delete</button></div></header>
        <div class="sgrid">${fld('visual','What we see',s.visual)}${fld('camera','Camera',s.camera)}${fld('voiceover','Voiceover',s.voiceover)}${fld('on_screen_text','On-screen text / subtitle',s.on_screen_text)}${fld('video_prompt','Video prompt',s.video_prompt,'wide')}</div></article>`).join('')}
      <div><span class="label">Closing call to action</span><p contenteditable="true" data-top="cta" style="margin-top:4px;font-weight:700">${esc(b.cta)}</p></div>

      $('[data-down]',card).onclick=()=>{ sync(); [board.scenes[i+1],board.scenes[i]]=[board.scenes[i],board.scenes[i+1]]; render(); };
      $('[data-del]',card).onclick=()=>{ sync(); board.scenes.splice(i,1); render(); };

    });
    $('[data-add]',wrap).onclick=()=>{ sync(); board.scenes.push({seconds:'3',visual:'',camera:'',voiceover:'',on_screen_text:'',video_prompt:''}); render(); };

    $('[data-copys]',wrap).onclick=()=>{ sync(); copyText(board.scenes.map((s,i)=>`SCENE ${i+1} (${s.seconds}s)\nVO: ${s.voiceover}\nTEXT: ${s.on_screen_text}`).join('\n\n')+'\n\nCTA: '+board.cta); };

    $$('.scene',wrap).forEach(card=>{ const s=board.scenes[+card.dataset.i]; $$('[data-k]',card).forEach(n=>s[n.dataset.k]=n.textContent.trim()); });
  }
  function boardMd(){ const b=board; return `# ${b.title}\n\n${b.concept}\n\n**Format:** ${b.aspect||lastV.aspect} · ${b.total_seconds}s · **Music:** ${b.music}\n\n`+b.scenes.map((s,i)=>`## Scene ${i+1} (${s.seconds}s)\n- **Visual:** ${s.visual}\n- **Camera:** ${s.camera}\n- **Voiceover:** ${s.voiceover}\n- **On-screen text:** ${s.on_screen_text}\n\n\`\`\`\n${s.video_prompt}\n\`\`\``).join('\n\n')+`\n\n**Call to action:** ${b.cta}\n`; }
  $('#dform').onsubmit=async e=>{
    e.preventDefault(); const v=readForm(e.target,F); lastV=v; if(ctl) ctl.abort(); ctl=new AbortController(); $('#dstop').hidden=false;
    wrap.innerHTML='<div class="outbody"><div class="think" id="dprog"><span class="dotp"></span>Developing the concept… this takes about a minute.</div></div>';
    const prompt=`You are an award-winning commercial director and copywriter. Plan a video advertisement.\nBusiness: ${v.biz}\nBrief: ${v.brief}\nLength: ${v.dur}\nPlatform/aspect: ${v.aspect}\nTone: ${v.tone}\nVoiceover: ${v.voice}\nLogo line/contact for the final frame: ${v.contact}\n\nReply with ONLY a JSON object, no other text:\n{"title": string, "concept": string (2-3 sentences: the big idea), "aspect": string, "total_seconds": number, "music": string (style and tempo), "cta": string, "scenes": [{"seconds": number, "visual": string, "camera": string, "voiceover": string (empty if none), "on_screen_text": string, "video_prompt": string (60-110 words, self-contained prompt for Veo/Runway/Kling including subject, action, setting, lens, lighting, colour, mood and the aspect ratio)}]}\nScene seconds must add up to the length. 4-8 scenes. The last scene shows the logo line and contact details. Never invent prices, awards or testimonials.`;
    try{
      if(!SAMPLE||!SAMPLE.json) throw {code:'sampling_disabled'};
      const d=await SAMPLE.json(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{ const n=(text.match(/"video_prompt"/g)||[]).length; const p=$('#dprog'); if(p) p.innerHTML=`<span class="dotp"></span>${n?'Writing scene '+n+'…':'Writing the script…'}`; }});
      if(!d||!Array.isArray(d.scenes)||!d.scenes.length) throw {code:'invalid_json'};
      board={title:String(d.title||'Video advertisement'),concept:String(d.concept||''),aspect:String(d.aspect||v.aspect),total_seconds:d.total_seconds||'',music:String(d.music||''),cta:String(d.cta||v.contact),scenes:d.scenes.map(s=>({seconds:String(s.seconds??''),visual:String(s.visual||''),camera:String(s.camera||''),voiceover:String(s.voiceover||''),on_screen_text:String(s.on_screen_text||''),video_prompt:String(s.video_prompt||'')}))};
      render();
    }catch(err){ wrap.innerHTML=err&&err.code==='cancelled'?'<div class="outbody"><p class="note">Stopped.</p></div>':`<div class="outbody"><p class="err">${esc(errCopy(err))}</p></div>`; }
    finally{ ctl=null; $('#dstop').hidden=true; }
  };
  $('#dstop').onclick=()=>ctl&&ctl.abort();
  const pre=PREFILL.director; delete PREFILL.director; if(pre&&pre.board){ board=pre.board; lastV={aspect:board.aspect}; render(); }
  return ()=>{ if(ctl) ctl.abort(); };
};

  $('#lc-photo',el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ bgPhoto=(await mkLoadImg(f,1600)).img; }catch(x){ toast('That photo could not be opened.'); } };
  function cover(img,W,H,mirror){ const iw=img.videoWidth||img.naturalWidth||img.width, ih=img.videoHeight||img.naturalHeight||img.height; if(!iw||!ih) return; const c=Math.max(W/iw,H/ih), dw=iw*c, dh=ih*c; ctx.save(); if(mirror){ ctx.translate(W,0); ctx.scale(-1,1); } ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh); ctx.restore(); }
  function drawFrame(){
    const W=cv.width, H=cv.height, t=(performance.now()-t0)/1000, bg=$('#lc-bg',el).value, mirror=facing==='user', ready=vid.readyState>=2;
    ctx.save(); ctx.globalAlpha=1;
    if(!ready){ ctx.fillStyle='#0B1222'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#93A0B8'; ctx.font=`600 ${Math.min(W,H)*.045}px Manrope, Arial`; ctx.textAlign='center'; ctx.fillText(stream?'Starting camera…':'Tap Turn on camera',W/2,H/2); ctx.restore(); return; }
    if(bg==='none'||!lastMask){ cover(vid,W,H,mirror); }
    else {
      if(bg==='blur'){ ctx.filter='blur(14px) brightness(.9)'; cover(vid,W,H,mirror); ctx.filter='none'; }
      else if(bg==='photo'&&bgPhoto){ cover(bgPhoto,W,H,false); }
      else if(bg==='color'){ const c=$('#lc-col',el).value; const g=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.8); g.addColorStop(0,c); g.addColorStop(1,'#000000'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
      else if(bg.startsWith('tpl:')){ const T=MK_TPL[bg.slice(4)]; mkBg(ctx,W,H,T,t,0); }
      else if(bg.startsWith('set:')){ mkSetBg(ctx,W,H,t,bg.slice(4)); }
      else { ctx.fillStyle='#0B1222'; ctx.fillRect(0,0,W,H); }
      if(person.width!==W||person.height!==H){ person.width=W; person.height=H; }
      pctx.save(); pctx.globalCompositeOperation='copy'; const iw=lastMask.width, ih=lastMask.height, vw=vid.videoWidth, vh=vid.videoHeight, c=Math.max(W/vw,H/vh), dw=vw*c, dh=vh*c;
      if(mirror){ pctx.translate(W,0); pctx.scale(-1,1); }
      pctx.filter=`blur(${+$('#lc-fe',el).value}px)`; pctx.drawImage(lastMask,0,0,iw,ih,(W-dw)/2,(H-dh)/2,dw,dh); pctx.filter='none';
      pctx.globalCompositeOperation='source-in'; pctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh); pctx.restore();
      const sz=+$('#lc-sz',el).value, ox=+$('#lc-x',el).value*W, oy=+$('#lc-y',el).value*H; ctx.save(); ctx.translate(W/2+ox,H/2+oy); ctx.scale(sz,sz); ctx.drawImage(person,-W/2,-H/2); ctx.restore();
    }
    mkEffect(ctx,W,H,t,$('#lc-fx',el).value);
    const title=$('#lc-title',el).value.trim();
    if(title){ const base=Math.min(W,H), T={text:'#FFFFFF',accent:'#F2B33D',gold:true,font:'serif',anim:'pop'}; const ts=base*.085; ctx.font=`700 ${ts}px "Playfair Display", Georgia, serif`; ctx.textAlign='center'; const lines=mkWrap(ctx,title,W*.86).slice(0,3); const y0=H-base*.12-lines.length*ts*1.1;
      lines.forEach((l,j)=>{ const yy=y0+ts*1.1*(j+.85); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=base*.02; ctx.fillStyle='#4A3008'; ctx.fillText(l,W/2+2,yy+3); ctx.shadowBlur=0; ctx.fillStyle=mkGoldFill(ctx,yy-ts*.8,yy+ts*.15,T); ctx.fillText(l,W/2,yy); }); }
    if(MK.credit){ const base=Math.min(W,H); ctx.font=`700 ${base*.022}px Manrope, Arial`; ctx.textAlign='right'; ctx.globalAlpha=.85; ctx.fillStyle='#FFFFFF'; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=4; ctx.fillText('AJ Magic Video · bjubileepress.com.ng',W-base*.03,base*.05); }
    if(rec){ const s=(performance.now()-recT0)/1000, base=Math.min(W,H); ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(base*.03,base*.03,base*.2,base*.06); ctx.fillStyle='#FF3B3B'; ctx.beginPath(); ctx.arc(base*.06,base*.06,base*.015,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.font=`700 ${base*.03}px Manrope, Arial`; ctx.textAlign='left'; ctx.fillText(mkFmt(s),base*.09,base*.072); }
    ctx.restore();

  async function segLoop(){
    if(!alive) return;
    if(seg&&segReady&&!segBusy&&vid.readyState>=2&&$('#lc-bg',el).value!=='none'){ segBusy=true; try{ await seg.send({image:vid}); }catch(e){} segBusy=false; }

  }
  function loop(){ if(!alive) return; drawFrame(); raf=requestAnimationFrame(loop); }

    if(!seg){ try{ await mkLoadSeg(); seg=new window.SelfieSegmentation({locateFile:f=>'lib/selfie/'+f}); seg.setOptions({modelSelection:1,selfieMode:false}); seg.onResults(r=>{ const m=r.segmentationMask; if(!m) return; const w=m.width||m.videoWidth, h=m.height||m.videoHeight; if(mask.width!==w||mask.height!==h){ mask.width=w; mask.height=h; } mctx.clearRect(0,0,w,h); mctx.drawImage(m,0,0,w,h);
        try{ const th=+$('#lc-th',el).value+($('#lc-spill',el).checked?.1:0), lo=th-.12, hi=th+.12, id=mctx.getImageData(0,0,w,h), a=id.data; for(let k=3;k<a.length;k+=4){ const v=a[k]/255, q=v<=lo?0:v>=hi?1:(v-lo)/(hi-lo); a[k]=q*q*(3-2*q)*255; } mctx.putImageData(id,0,0); }catch(x){}
        lastMask=mask; }); await seg.initialize(); segReady=true; segLoop(); }
      catch(e){ seg=null; $('#lcNote',el).textContent='Background cut-out is not available on this device, so the real background is shown. You can still record.'; } }
  }
  $('#lcStart',el).onclick=startCam;
  $('#lcFlip',el).onclick=()=>{ facing=facing==='user'?'environment':'user'; startCam(); };
  $('#lcRec',el).onclick=async()=>{
    const btn=$('#lcRec',el), res=$('#lcResult',el);
    if(rec){ rec.stop(); return; }
    const out=cv.captureStream(30);
    let mixDest=null; try{ pac=new MK_AC(); await pac.resume(); mixDest=pac.createMediaStreamDestination(); const mic=pac.createMediaStreamSource(stream); mic.connect(mixDest);
      const mt=$('#lc-music',el).value; if(mt!=='none'){ const buf=await mkRenderSong(mt,120); if(buf){ const s=pac.createBufferSource(); s.buffer=buf; s.loop=true; const g=pac.createGain(); g.gain.value=.25; s.connect(g); g.connect(mixDest); s.start(); pnodes.push(s); } }
      mixDest.stream.getAudioTracks().forEach(tr=>out.addTrack(tr)); }catch(e){ stream.getAudioTracks().forEach(tr=>out.addTrack(tr)); }

    rec.onstop=()=>{ const type=(rec.mimeType||mime||'video/webm').split(';')[0], ext=type.indexOf('mp4')>=0?'mp4':'webm'; rec=null; btn.textContent='Record'; clearTimeout(btn._cap); pnodes.forEach(n=>{ try{ n.stop(); }catch(x){} }); pnodes=[]; if(pac){ try{ pac.close(); }catch(x){} pac=null; }
      out.getVideoTracks().forEach(t=>t.stop()); const blob=new Blob(chunks,{type}); if(!blob.size){ res.innerHTML='<p class="err">Nothing was recorded. Try again.</p>'; return; }
      if(outUrl) URL.revokeObjectURL(outUrl); outUrl=URL.createObjectURL(blob); const name='aj-magic-camera-'+Date.now().toString(36)+'.'+ext;
      res.innerHTML=`<div class="mk-result"><video controls playsinline src="${outUrl}"></video><div class="srow"><span class="note mono">${ext.toUpperCase()} · ${cv.width}×${cv.height} · ${(blob.size/1048576).toFixed(1)} MB</span><span class="actions"><button class="btn gold small" type="button" id="lcSave">Save video</button><button class="btn line small" type="button" id="lcShare" hidden>Share to TikTok, WhatsApp…</button></span></div></div>`;
      $('#lcSave',el).onclick=async e=>{ const b=e.currentTarget; b.disabled=true; const uri=await mkSaveBlob(name,blob); b.disabled=false; if(uri&&window.AJBridge){ b.textContent='Saved'; const sh=$('#lcShare',el); sh.hidden=false; sh.onclick=()=>window.AJBridge.share(uri,type); } }; };
    rec.start(500); recT0=performance.now(); btn.textContent='Stop'; res.innerHTML=''; btn._cap=setTimeout(()=>{ if(rec) rec.stop(); },120000);
  };
  size('9:16'); loop();
  return ()=>{ alive=false; cancelAnimationFrame(raf); if(rec){ try{ rec.stop(); }catch(e){} } if(stream) stream.getTracks().forEach(t=>t.stop()); pnodes.forEach(n=>{ try{ n.stop(); }catch(x){} }); if(pac){ try{ pac.close(); }catch(e){} } };
};
